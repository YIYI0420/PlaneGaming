<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1114">
  <title>断电之后 · 三关撤离</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1114;color:#dce0d9;font-family:system-ui,"Microsoft YaHei",sans-serif}header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #334044}header strong{letter-spacing:3px}nav{display:flex;gap:20px;align-items:center}a{color:#b4c3b5;text-decoration:none}button{background:#c4af78;color:#131b1e;border:0;padding:7px 18px;cursor:pointer;font:inherit}main{position:relative;height:calc(100dvh - 98px);min-height:320px;max-width:1920px;margin:auto;background:#111b1e}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}footer{height:50px;display:flex;align-items:center;justify-content:center;padding:8px 16px;color:#8d9e9e;font-size:13px;line-height:1.6;text-align:center}#loading{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 70%,#263c3d,#0b1114 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;padding:24px;text-align:center}#loading h1{font-size:clamp(32px,6vw,72px);letter-spacing:.2em;margin:0;color:#e4e1d2}#loading p{color:#a5b4ae;margin:0}progress{width:min(380px,80vw);height:5px;accent-color:#c4af78}#error{max-width:680px;color:#f0b7a4;white-space:pre-wrap;overflow-wrap:anywhere}#retry{display:none}#rotate{display:none}#fullscreen:disabled{opacity:.4;cursor:default}@media(orientation:landscape) and (max-height:540px){header,footer{display:none}main{height:100dvh}}@media(orientation:portrait) and (max-width:700px){#rotate{position:absolute;bottom:16px;left:12px;right:12px;background:#17262ee6;padding:12px;text-align:center;pointer-events:none}header{padding:0 12px}nav{gap:12px}footer{font-size:11px}}
  </style>
</head>
<body>
  <header><strong>断电之后</strong><nav><a href="../blackout/">轻量版</a><a href="credits.html">素材署名</a><button id="fullscreen" disabled>全屏</button></nav></header>
  <main id="game-shell">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="断电之后游戏画面"></canvas>
    <section id="loading" role="status"><p>最后一班车不会来了。</p><h1>断电之后</h1><p id="status">正在准备撤离通道…</p><progress id="progress" max="1" value="0"></progress><p id="error" role="alert"></p><button id="retry">重新加载</button></section>
    <div id="rotate">横屏游玩体验更好 · 左侧移动，右侧转向</div>
  </main>
  <footer>WASD 移动 · 鼠标瞄准 · 左键射击 · 右键开镜 / 重击 · Shift 奔跑 · 空格跳跃 · Esc 暂停</footer>
  <script>
    const canvas=document.querySelector('#unity-canvas'),status=document.querySelector('#status'),progress=document.querySelector('#progress'),error=document.querySelector('#error'),loading=document.querySelector('#loading'),fullscreen=document.querySelector('#fullscreen');
    const fail=message=>{loading.style.display='flex';status.textContent='暂时无法进入游戏';error.textContent=String(message);document.querySelector('#retry').style.display='block';};
    document.querySelector('#retry').onclick=()=>location.reload();canvas.addEventListener('contextmenu',event=>event.preventDefault());
    const config={dataUrl:'Build/9af2223916a732a8bcc1d7a3e9afe07c.data.unityweb',frameworkUrl:'Build/d25ba467e7a56ff6ad92506c6c01d2e2.framework.js.unityweb',codeUrl:'Build/9989a8cf2711a5a42ad74b273ec326d9.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'ORBIT',productName:'After the Blackout',productVersion:"1.0",fullscreenElementID:'game-shell',devicePixelRatio:Math.min(devicePixelRatio||1,1.5),showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message);}};
    const loader=document.createElement('script');loader.src='Build/05e4f8149def4c375286b8fb60e739ed.loader.js';loader.onerror=()=>fail('游戏文件未能下载，请检查网络后重试。');
    loader.onload=()=>createUnityInstance(canvas,config,value=>{progress.value=value;status.textContent='正在加载 '+Math.round(value*100)+'%';}).then(game=>{loading.style.display='none';fullscreen.disabled=false;fullscreen.onclick=()=>game.SetFullscreen(1);canvas.focus();}).catch(fail);document.body.append(loader);
  </script>
</body>
</html>
